name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    tags: ["v*"]

jobs:
  build-macos:
    name: macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build (PyInstaller)
        run: |
          pyinstaller Moderator.spec --noconfirm --clean

      - name: Package artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Moderator.app" "Moderator-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moderator-macOS
          path: Moderator-macOS.zip

  build-windows:
    name: Windows (folder)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build (PyInstaller)
        run: |
          pyinstaller Moderator.spec --noconfirm --clean

      - name: Upload artifact (folder)
        uses: actions/upload-artifact@v4
        with:
          name: Moderator-windows
          path: dist/Moderator/**
